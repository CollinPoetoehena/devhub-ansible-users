---
# SSH key management for the users role.
#
# Two types of keys are handled per user:
#
#   ssh_private_keys — deploy private key files to the user's ~/.ssh/ directory
#     so the user can initiate outbound SSH connections (e.g. to workload VMs).
#     Each entry: { src: <path on controller>, dest: <filename or absolute path> }
#     If dest is a filename only (no leading /), it is placed under ~/.ssh/.
#     NOTE: Private keys are sensitive, so only the src path is used (instead of the full content) for security. 
#     The private key file must exist on the Ansible controller and be protected with appropriate permissions.
#
#   ssh_public_keys  — authorise public keys so external clients can log in as
#     this user. Uses ansible.posix.authorized_key, which appends to
#     ~/.ssh/authorized_keys idempotently.
#     Each entry: { key: <full pubkey string>, comment: <optional label> }
#
# Requirements:
#   ansible.posix collection must be installed for the authorized_key task.
#   Install with: ansible-galaxy collection install ansible.posix

# ==================== Ensure .ssh directory ====================
# The directory must exist with strict permissions before any keys are placed.
# We only create it for users that have at least one key defined.

- name: Ensure ~/.ssh directory exists for users with SSH keys
  ansible.builtin.file:
    path: "/home/{{ item.username }}/.ssh"
    state: directory
    owner: "{{ item.username }}"
    group: "{{ item.group }}"
    mode: "0700"
  loop: "{{ users_list }}"
  loop_control:
    label: "{{ item.username }}" # show username instead of the full dict in Ansible output
  when: >
    (item.ssh_private_keys | default([]) | length > 0) or
    (item.ssh_public_keys  | default([]) | length > 0)

# ==================== Deploy private keys ====================
# Iterates over every (user, private_key) combination using subelements so
# each key is deployed independently, allowing partial updates.
#
# dest handling: if the dest value contains no '/', treat it as a filename
# relative to ~/.ssh/; otherwise use it as an absolute path.

- name: Deploy private SSH keys to users
  ansible.builtin.copy:
    src: "{{ item.1.src }}"
    dest: >-
      {{ item.1.dest if '/' in item.1.dest
         else '/home/' + item.0.username + '/.ssh/' + item.1.dest }}
    owner: "{{ item.0.username }}"
    group: "{{ item.0.group }}"
    mode: "0600" # Private keys must have strict permissions to be used by SSH
  loop: "{{ users_list | subelements('ssh_private_keys', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.username }}: {{ item.1.dest }}" # show user + key dest instead of the full dict in Ansible output

# ==================== Authorise public keys ====================
# ansible.posix.authorized_key manages ~/.ssh/authorized_keys idempotently.
# Each key is added independently; existing unrelated keys are preserved.

- name: Authorise public SSH keys for users
  ansible.posix.authorized_key:
    user: "{{ item.0.username }}"
    key: "{{ item.1.key }}"
    comment: "{{ item.1.comment | default(omit) }}"
    state: present
  loop: "{{ users_list | subelements('ssh_public_keys', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.username }}: {{ item.1.comment | default(item.1.key[:30] + '...') }}" # show user + key comment instead of the full dict in Ansible output and truncate long keys (max 30 chars) for readability